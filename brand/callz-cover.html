<!doctype html>
<!-- The share card (1200 x 630) shown when a callz.fun link is posted. Rendered to apps/web/public/og.png. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px; height: 630px; overflow: hidden; color: #eaecef; background: #0b0e11;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background-image:
          radial-gradient(900px 520px at 88% 12%, rgba(247, 185, 40, 0.20), transparent 62%),
          radial-gradient(700px 480px at 6% 100%, rgba(247, 185, 40, 0.10), transparent 60%);
      }
      main { height: 100%; padding: 64px 72px; display: grid; grid-template-columns: 1fr 360px; align-items: center; gap: 40px; }
      .eyebrow { color: #f7b928; font-size: 22px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
      h1 { margin-top: 22px; font-size: 92px; line-height: 1; letter-spacing: -0.035em; font-weight: 800; }
      h1 span { color: #f7b928; }
      p { margin-top: 28px; max-width: 640px; color: #a3abb6; font-size: 29px; line-height: 1.35; }
      .foot { margin-top: 44px; display: flex; align-items: center; gap: 16px; font-size: 28px; font-weight: 700; }
      .foot i { width: 10px; height: 10px; border-radius: 50%; background: #f7b928; }
      .foot span { color: #a3abb6; font-weight: 500; }
      .mark { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(247, 185, 40, 0.25)); }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div class="eyebrow">Built on Flap Pool Launch · BNB Chain</div>
        <h1>Mint the pass.<br /><span>Make the call.</span></h1>
        <p>Every launch live, with charts, PancakeSwap trading and chat. NFT pass mints that fund a token's first liquidity pool.</p>
        <div class="foot">CallZ <i></i> <span>callz.fun</span></div>
      </div>
      <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="140 150 744 744" aria-hidden="true">
        <path fill="#f7b928" d="M288 192h448c61 0 110 49 110 110v358c0 61-49 110-110 110H355L208 868l32-133c-37-18-62-56-62-99V302c0-61 49-110 110-110z" />
        <path fill="#111" d="M340 296h360v76L520 558h196l-24 102H318v-64l190-208H330z" />
      </svg>
    </main>
  </body>
</html>
